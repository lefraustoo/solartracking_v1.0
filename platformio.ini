; PlatformIO Project Configuration File

; [platformio]
; default_envs = mega ; Entorno por defecto al darle "Build"

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
; Filtro de compilación: Solo compila lo que está en esta carpeta
build_src_filter = +<controlador_uno/>
; Gestión de librerías: Solo descarga las que este entorno necesita
lib_deps = 
    arduino-libraries/Servo@1.2.1

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 9600
; Filtro de compilación: Solo compila lo que está en esta carpeta
build_src_filter = +<datalogger_mega/>
; Gestión de librerías: Descarga todo lo necesario para el logger
lib_deps = 
    arduino-libraries/SD
    adafruit/RTClib
    adafruit/Adafruit ADS1X15
    adafruit/Adafruit BusIO
    jrowberg/I2Cdevlib-Core
    ; jrowberg/MPU6050
    wollewald/INA226_WE